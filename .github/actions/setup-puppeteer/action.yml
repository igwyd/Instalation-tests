name: Setup Puppeteer
description: >
  Install Chrome, clone Dep.Tests, set up Python and Node for puppeteer tests.
  Must be called after actions/checkout.

inputs:
  git_ssh_private_key:
    description: SSH private key for cloning Dep.Tests
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up nodejs
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install prerequisites for puppeteer tests
      shell: bash
      run: |
        timeout 300 sudo apt-get update || true
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb
        sudo apt-get install -f -y
        google-chrome --version
        python3 --version
        pip3 --version
        node -v
        npm -v

        mkdir -p ~/.ssh
        echo "${{ inputs.git_ssh_private_key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval $(ssh-agent -s)
        ssh-add ~/.ssh/id_rsa
        ssh-keyscan git.onlyoffice.com >> ~/.ssh/known_hosts
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git clone git@git.onlyoffice.com:ONLYOFFICE-QA/Dep.Tests.git
        cd Dep.Tests
        sed -i 's/url=https:\/\/github.com\/ONLYOFFICE-data\/pp-files.git/url = git@github.com:ONLYOFFICE-data\/pp-files.git/' .gitmodules
        git submodule update --init puppeteer/files
        cd puppeteer/engine
        npm install
        # devs won't fix the missing sdkjs/pdf/src/annotations/stamps/en-US.json, so this WOPI test fails on every build: drop it from the daily suite
        jq 'map(select(test("insert_stamp_save") | not))' ../test-suites/wopi/daily.json > ../test-suites/wopi/daily.json.new
        mv ../test-suites/wopi/daily.json.new ../test-suites/wopi/daily.json
        cp ../config_chrome_linux.json ../config_chrome_linux.json.bak
