name: Run Puppeteer Tests
description: Patch DS URL in config, run API and WOPI smoke tests (--suite daily)

inputs:
  url:
    description: 'Value for testOptions.url (e.g. http://1.2.3.4/example/)'
    required: true

runs:
  using: composite
  steps:
    - name: Clear puppeteer output
      shell: bash
      run: rm -rf Dep.Tests/puppeteer/out

    - name: Set puppeteer URL
      shell: bash
      run: |
        which jq || sudo apt-get install -y jq
        cd Dep.Tests/puppeteer/engine
        # HttpsUpgrades flag for Chrome 157+ is added once in setup-puppeteer
        jq --arg url "${{ inputs.url }}" '.testOptions.url = $url' ../config_chrome_linux.json > tmp.json
        mv tmp.json ../config_chrome_linux.json
        echo "-------------------------------------"
        cat ../config_chrome_linux.json
        echo "-------------------------------------"

    - name: Diagnose Chrome navigation to DS
      shell: bash
      continue-on-error: true
      run: |
        NODE_PATH="$PWD/Dep.Tests/puppeteer/engine/node_modules" timeout 300 node .github/scripts/chrome-nav-diag.js "${{ inputs.url }}"

    - name: Puppeteer API tests
      shell: bash
      continue-on-error: true
      run: |
        cd Dep.Tests/puppeteer/engine
        python3 run.py \
          --suite daily \
          --disable_animation \
          --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome puppeteerOptions.protocolTimeout=100000 \
          --threads 2 \
          --providers example

    - name: Puppeteer WOPI tests
      shell: bash
      continue-on-error: true
      run: |
        cd Dep.Tests/puppeteer/engine
        python3 run.py \
          --suite daily \
          --disable_animation \
          --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome puppeteerOptions.protocolTimeout=100000 \
          --threads 2 \
          --providers wopi
