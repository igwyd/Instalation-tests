name: 'Check DS logs for errors'
description: 'Count error lines in DS logs and write result to GITHUB_ENV'

inputs:
  mode:
    description: 'Execution mode: ssh-native | ssh-docker | docker-local | ssh-docker-logs'
    required: true
  ssh_host:
    description: 'SSH host IP or domain'
    required: false
    default: ''
  ssh_user:
    description: 'SSH user'
    required: false
    default: 'ubuntu'
  container:
    description: 'Docker container name or ID (for docker modes)'
    required: false
    default: ''
  env_var:
    description: 'Name of the GITHUB_ENV variable to set with error count'
    required: true
  label:
    description: 'Label for log output (e.g. EE, DE, CE)'
    required: false
    default: ''
  sample_lines:
    description: 'How many unique error lines to keep for the dashboard'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Count DS log errors
      shell: bash
      run: |
        PATTERN='(?i)(?:\[error\]|typeerror|failed to load|load error)'
        # Known false-positives to exclude
        EXCLUDE='sdkjs/pdf/src/annotations/stamps/'
        LOG_FILES=(
          /var/log/onlyoffice/documentserver/converter/out.log
          /var/log/onlyoffice/documentserver/converter/err.log
          /var/log/onlyoffice/documentserver/docservice/out.log
          /var/log/onlyoffice/documentserver/docservice/err.log
          /var/log/onlyoffice/documentserver/metrics/out.log
          /var/log/onlyoffice/documentserver/metrics/err.log
          /var/log/onlyoffice/documentserver/nginx.error.log
          /var/log/onlyoffice/documentserver-example/out.log
          /var/log/onlyoffice/documentserver/adminpanel/out.log
          /var/log/onlyoffice/documentserver/adminpanel/err.log
        )
        # writes matches to a temp file, then prints: count, marker, deduped sample
        TAIL="> /tmp/ds_log_errors.txt; wc -l < /tmp/ds_log_errors.txt; echo ===SAMPLE===; sort -u /tmp/ds_log_errors.txt | head -n ${{ inputs.sample_lines }} | cut -c1-300"

        case "${{ inputs.mode }}" in
          ssh-native)
            OUT=$(ssh -o StrictHostKeyChecking=no ${{ inputs.ssh_user }}@${{ inputs.ssh_host }} \
              "sudo grep -Ph \"$PATTERN\" ${LOG_FILES[*]} 2>/dev/null | grep -Pv \"$EXCLUDE\" $TAIL" 2>/dev/null || echo "0")
            ;;
          ssh-docker)
            OUT=$(ssh -o StrictHostKeyChecking=no ${{ inputs.ssh_user }}@${{ inputs.ssh_host }} \
              "sudo docker exec ${{ inputs.container }} bash -c 'grep -Ph \"$PATTERN\" ${LOG_FILES[*]} 2>/dev/null | grep -Pv \"$EXCLUDE\" $TAIL'" 2>/dev/null || echo "0")
            ;;
          docker-local)
            OUT=$(docker exec ${{ inputs.container }} bash -c "grep -Ph \"$PATTERN\" ${LOG_FILES[*]} 2>/dev/null | grep -Pv \"$EXCLUDE\" $TAIL" 2>/dev/null || echo "0")
            ;;
          ssh-docker-logs)
            OUT=$(ssh -o StrictHostKeyChecking=no ${{ inputs.ssh_user }}@${{ inputs.ssh_host }} \
              "sudo docker logs ${{ inputs.container }} 2>&1 | grep -Ph \"$PATTERN\" 2>/dev/null | grep -Pv \"$EXCLUDE\" $TAIL" 2>/dev/null || echo "0")
            ;;
          *)
            echo "Unknown mode: ${{ inputs.mode }}"
            OUT="0"
            ;;
        esac

        ERRORS=$(printf '%s\n' "$OUT" | head -n 1 | tr -dc '0-9')
        if [ -z "$ERRORS" ]; then ERRORS=0; fi
        # everything after the marker is the sample; strip our own heredoc delimiter just in case
        SAMPLE=$(printf '%s\n' "$OUT" | sed -n '/^===SAMPLE===$/,$p' | tail -n +2 | grep -v '^DSLOGEOF$' || true)

        echo "DS log errors ${{ inputs.label }}: $ERRORS"
        if [ -n "$SAMPLE" ]; then printf '%s\n' "$SAMPLE"; fi

        {
          echo "${{ inputs.env_var }}=$ERRORS"
          echo "${{ inputs.env_var }}_TEXT<<DSLOGEOF"
          printf '%s\n' "$SAMPLE"
          echo "DSLOGEOF"
        } >> $GITHUB_ENV
