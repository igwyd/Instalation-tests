                  'healthy':               b('HEALTHCHECK_AZURE_STORAGE_DIRECTURL_TRUE'),
                  'version_ok':            b('VERSION_AZURE_STORAGE_DIRECTURL_TRUE_OK'),
                  'version_actual':        s('VERSION_AZURE_STORAGE_DIRECTURL_TRUE_ACTUAL'),
                  'puppeteer_failed':      azt_ppt,
                  'puppeteer_ok':          azt_ok,
                  'puppeteer_total':       azt_total,
                  'ds_log_errors':         azt_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_AZURE_STORAGE_DIRECTURL_TRUE') and b('VERSION_AZURE_STORAGE_DIRECTURL_TRUE_OK') and ppt_ok(azt_ppt, azt_total) and azt_ds == 0) else 'failure',
              },
              'az_encryption_scope': {
                  'healthy':               b('HEALTHCHECK_AZURE_STORAGE_ENCRYPTION_SCOPE'),
                  'version_ok':            b('VERSION_AZURE_STORAGE_ENCRYPTION_SCOPE_OK'),
                  'version_actual':        s('VERSION_AZURE_STORAGE_ENCRYPTION_SCOPE_ACTUAL'),
                  'puppeteer_failed':      aze_ppt,
                  'puppeteer_ok':          aze_ok,
                  'puppeteer_total':       aze_total,
                  'ds_log_errors':         aze_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_AZURE_STORAGE_ENCRYPTION_SCOPE') and b('VERSION_AZURE_STORAGE_ENCRYPTION_SCOPE_OK') and ppt_ok(aze_ppt, aze_total) and aze_ds == 0) else 'failure',
              },
              'conclusion': os.environ.get('FINAL_CONCLUSION', 'failure'),
          }
          path = '.github/workflow-results/dev-srv-storage.json'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          print(f'Saved: {path}')
          PYEOF

          aws s3 cp .github/workflow-results/dev-srv-storage.json \
            s3://${{ vars.DASHBOARD_BUCKET_NAME }}/results/dev-srv-storage.json \
            --region ${{ vars.DASHBOARD_BUCKET_REGION }}

      - name: Clear S3 bucket files folder
        if: always()
        run: |
          sleep 10 && aws s3 rm s3://${{ secrets.AWS_DEV_SERVER_BUCKET_NAME }}/files/ --recursive

      - name: Docker cleanup after run
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ vars.AWS_DEV_SERVER_EC2_IP }} \
            "sudo docker stop \$(sudo docker ps -q) 2>/dev/null || true && sudo docker system prune -af"

      - name: Stop EC2 Instance
        if: always()
        run: |
          aws ec2 stop-instances --instance-ids ${{ secrets.AWS_DEV_SERVER_INSTANCE_ID }}
          aws ec2 wait instance-stopped --instance-ids ${{ secrets.AWS_DEV_SERVER_INSTANCE_ID }}
