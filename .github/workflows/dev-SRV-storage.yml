      # ============================ MinIO HTTP cycles ============================
      # MinIO runs in a container on the same EC2, published on :9000. Endpoint is
      # the EC2 public IP so the puppeteer browser (on the GitHub runner) can reach
      # presigned URLs directly when useDirectStorageUrls=true. The DS container
      # cannot reach the EC2's own public IP (AWS has no hairpin NAT), so an iptables
      # DNAT rule on the host redirects <EC2_IP>:9000 -> 172.17.0.1:9000 (host MinIO).
      # MinIO + the DNAT rule + the bucket are set up once and reused by all 3 cycles.

      - name: MINIO_HTTP_FALSE Docker reInstall
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ vars.AWS_DEV_SERVER_EC2_IP }} << EOF
          sudo docker stop ds-ee-dev || true
          sudo docker rm ds-ee-dev || true
          sudo docker run -itd -p 8080:80 -e WOPI_ENABLED=true --name ds-ee-dev onlyoffice/4testing-documentserver-ee:${{ vars.ONLYOFFICE_DEV_VERSION }}.${{ vars.ONLYOFFICE_DEV_BUILD }}
