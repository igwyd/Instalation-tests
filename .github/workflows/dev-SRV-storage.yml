      - name: MINIO_HTTP_FALSE Start MinIO server
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ vars.AWS_DEV_SERVER_EC2_IP }} << EOF
          sudo docker rm -f minio 2>/dev/null || true
          sudo rm -rf /opt/minio/data && sudo mkdir -p /opt/minio/data
          sudo docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -v /opt/minio/data:/data minio/minio server /data
          sleep 15
          sudo docker run --rm --network host --entrypoint /bin/sh minio/mc \
            -c "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/ds-http-minio"
          # hairpin workaround: DS container -> EC2 public IP:9000 -> host MinIO
          sudo iptables -t nat -C PREROUTING -p tcp -d ${{ vars.AWS_DEV_SERVER_EC2_IP }} --dport 9000 -j DNAT --to-destination 172.17.0.1:9000 2>/dev/null || \
