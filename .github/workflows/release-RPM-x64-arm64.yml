          path = '.github/workflow-results/release-rpm-${{ matrix.arch }}.json'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          print(f'Saved: {path}')
          PYEOF

          aws s3 cp .github/workflow-results/release-rpm-${{ matrix.arch }}.json             s3://${{ vars.DASHBOARD_BUCKET_NAME }}/results/release-rpm-${{ matrix.arch }}.json             --region ${{ vars.DASHBOARD_BUCKET_REGION }}

      - name: Delete EC2 Instance
        if: always()
