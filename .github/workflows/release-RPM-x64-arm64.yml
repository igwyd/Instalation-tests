          fi
          echo "VERSION_DE_ACTUAL=$VERSION" >> $GITHUB_ENV

      - name: Add example host to DS ipfilter
        continue-on-error: true
        uses: ./.github/actions/set-ipfilter
        with:
          mode: ssh-native
          ssh_user: ec2-user
          ssh_host: ${{ env.EC2_IP }}
          allow_hosts: ${{ env.EC2_IP }}

      - name: Start ds-example DE
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_IP }} \
            "sudo systemctl start ds-example"

      - name: Clear puppeteer output before DE tests
        run: rm -rf Dep.Tests/puppeteer/out

      - name: Puppeteer API tests ONLYOFFICE-Docs DE
        continue-on-error: true
        run: |
          cd Dep.Tests/puppeteer/engine
          echo "-------------------------------------"
          cat ../config_chrome_linux.json
          echo "-------------------------------------"
          python3 run.py --suite daily --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome puppeteerOptions.protocolTimeout=100000 --providers example

      - name: Puppeteer WOPI tests ONLYOFFICE-Docs DE
        continue-on-error: true
        run: |
          cd Dep.Tests/puppeteer/engine
          echo "-------------------------------------"
          cat ../config_chrome_linux.json
          echo "-------------------------------------"
          python3 run.py --suite daily --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome puppeteerOptions.protocolTimeout=100000 --providers wopi

      - name: Parse puppeteer results DE
        if: always()
        run: python3 .github/scripts/parse-puppeteer-results.py --edition DE

      - name: Documentserver logs ONLYOFFICE-Docs DE
        continue-on-error: true
        uses: ./.github/actions/ds-logs
        with:
          mode: ssh-native
          ssh_host: ${{ env.EC2_IP }}
          ssh_user: ec2-user

      - name: Check DS logs for errors DE
        continue-on-error: true
        uses: ./.github/actions/check-ds-logs
        with:
          mode: ssh-native
          ssh_host: ${{ env.EC2_IP }}
          ssh_user: ec2-user
          env_var: DS_LOG_ERRORS_DE
          label: DE

      - name: Remove ONLYOFFICE-Docs DE
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_IP }} << EOF
          sudo dnf remove onlyoffice-documentserver-de -y
          sudo rm -rvf /etc/onlyoffice /var/www/onlyoffice /var/log/onlyoffice
          EOF

      - name: Reboot EC2 Instance
        run: aws ec2 reboot-instances --instance-ids ${{ env.INSTANCE_ID }}

      - name: Wait for instance to reboot
        run: sleep 120

      - name: Install ONLYOFFICE-Docs CE
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ec2-user@${{ env.EC2_IP }} << EOF
          sudo dnf install onlyoffice-documentserver -y
          sudo service nginx start
          sudo systemctl enable nginx
          printf 'localhost\nonlyoffice\nonlyoffice\nonlyoffice\nlocalhost\nguest\nguest\n' | sudo documentserver-configure.sh --wopienabled true
          EOF

      - name: Info about installed Package, must be ONLYOFFICE-Docs CE
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_IP }} << EOF
          echo "-------------healthcheck-------------"
          sudo sleep 10
          sudo curl -s http://${{ env.EC2_IP }}:8083/healthcheck; echo
          echo "-------------DS services-------------"
          sudo systemctl list-unit-files --type=service | grep ds-
          echo "---------Installed packages----------"
          sudo rpm -qa | grep onlyoffice-documentserver
          echo "--------packageType--------"
          sudo curl -s http://127.0.0.1:8000/info/info.json | jq | grep -i -e buildVersion -e buildNumber -e packageType
          echo "-------------WOPI local--------------"
          sudo curl -s http://127.0.0.1:8083/hosting/discovery | tail -c 150; echo
          echo "------------WOPI external------------"
          sudo curl -s http://${{ env.EC2_IP }}:8083/hosting/discovery | tail -c 150; echo
          EOF

      - name: Check DS default services CE
        continue-on-error: true
        run: |
          SSH_TARGET=ec2-user@${{ env.EC2_IP }} SUFFIX=CE VERSION="${{ vars.ONLYOFFICE_RELEASE_VERSION }}" \
            bash .github/scripts/check-ds-services.sh

      - name: Check healthcheck CE
        continue-on-error: true
        run: |
          HC=$(curl -s "http://${{ env.EC2_IP }}:8083/healthcheck" || echo "error")
          # real TCP port curl connected to (0 = no connection), shown next to healthcheck in the dashboard
          echo "HC_PORT_CE=$(curl -s -o /dev/null -w '%{remote_port}' "http://${{ env.EC2_IP }}:8083/healthcheck" || true)" >> $GITHUB_ENV
          echo "Healthcheck CE: $HC"
          echo "HEALTHCHECK_CE=$HC" >> $GITHUB_ENV

      - name: Check version CE
        continue-on-error: true
        run: |
          VERSION=$(ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_IP }} \
            "rpm -q onlyoffice-documentserver --queryformat '%{VERSION}' 2>/dev/null || echo 'not-found'")
          EXPECTED="${{ vars.ONLYOFFICE_RELEASE_VERSION }}"
          echo "Version CE: installed=$VERSION, expected=$EXPECTED"
          if [ "$VERSION" = "$EXPECTED" ]; then
            echo "VERSION_CE_OK=true" >> $GITHUB_ENV
          else
            echo "VERSION_CE_OK=false" >> $GITHUB_ENV
          fi
          echo "VERSION_CE_ACTUAL=$VERSION" >> $GITHUB_ENV

      - name: Add example host to DS ipfilter
        continue-on-error: true
        uses: ./.github/actions/set-ipfilter
        with:
          mode: ssh-native
          ssh_user: ec2-user
          ssh_host: ${{ env.EC2_IP }}
          allow_hosts: ${{ env.EC2_IP }}

      - name: Start ds-example CE
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_IP }} \
            "sudo systemctl start ds-example"

      - name: Clear puppeteer output before CE tests
        run: rm -rf Dep.Tests/puppeteer/out

      - name: Puppeteer API tests ONLYOFFICE-Docs CE
        continue-on-error: true
        run: |
          cd Dep.Tests/puppeteer/engine
          echo "-------------------------------------"
          cat ../config_chrome_linux.json
          echo "-------------------------------------"
          python3 run.py --suite daily --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome puppeteerOptions.protocolTimeout=100000 --providers example

      - name: Puppeteer WOPI tests ONLYOFFICE-Docs CE
        continue-on-error: true
        run: |
          cd Dep.Tests/puppeteer/engine
          echo "-------------------------------------"
          cat ../config_chrome_linux.json
          echo "-------------------------------------"
          python3 run.py --suite daily --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome puppeteerOptions.protocolTimeout=100000 --providers wopi

      - name: Parse puppeteer results CE
        if: always()
        run: python3 .github/scripts/parse-puppeteer-results.py --edition CE

      - name: Documentserver logs ONLYOFFICE-Docs CE
        continue-on-error: true
        uses: ./.github/actions/ds-logs
        with:
          mode: ssh-native
          ssh_host: ${{ env.EC2_IP }}
          ssh_user: ec2-user

      - name: Check DS logs for errors CE
        continue-on-error: true
        uses: ./.github/actions/check-ds-logs
        with:
          mode: ssh-native
          ssh_host: ${{ env.EC2_IP }}
          ssh_user: ec2-user
          env_var: DS_LOG_ERRORS_CE
          label: CE

      - name: Remove ONLYOFFICE-Docs CE
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_IP }} << EOF
          sudo dnf remove onlyoffice-documentserver -y
          sudo rm -rvf /etc/onlyoffice /var/www/onlyoffice /var/log/onlyoffice
          EOF

      - name: Final check
        if: always()
        run: |
          FAILED=0

          echo "=== Version results ==="
          EXPECTED="${{ vars.ONLYOFFICE_RELEASE_VERSION }}"
          echo "Expected version: $EXPECTED"
          for VAR in VERSION_EE_OK VERSION_DE_OK VERSION_CE_OK; do
            VAL="${!VAR}"
            ACTUAL_VAR="${VAR/_OK/_ACTUAL}"
            ACTUAL="${!ACTUAL_VAR}"
            echo "$VAR: ${VAL:-not set} (actual: ${ACTUAL:-not set})"
            if [ "${VAL}" != "true" ]; then
              echo "$VAR FAILED"
              FAILED=1
            fi
          done

          echo "=== Healthcheck results ==="
          for VAR in HEALTHCHECK_EE HEALTHCHECK_DE HEALTHCHECK_CE; do
            VAL="${!VAR}"
            echo "$VAR: ${VAL:-not set}"
            if [ "${VAL}" != "true" ]; then
              echo "$VAR FAILED"
              FAILED=1
            fi
          done

          echo "=== DS services check ==="
          for VAR in SERVICES_EE_OK SERVICES_DE_OK SERVICES_CE_OK; do
            VAL="${!VAR}"
            echo "$VAR: ${VAL:-not set}"
            if [ "${VAL}" != "true" ]; then
              echo "$VAR FAILED — unexpected services enabled after install"
              FAILED=1
            fi
          done

          echo "=== Puppeteer results ==="
          for EDITION in EE DE CE; do
            F_VAR="PUPPETEER_${EDITION}_FAILED"
            O_VAR="PUPPETEER_${EDITION}_OK"
            T_VAR="PUPPETEER_${EDITION}_TOTAL"
            F="${!F_VAR:-0}"; O="${!O_VAR:-0}"; T="${!T_VAR:-0}"
            echo "$EDITION: ${O}/${T} passed, ${F} failed"
            if [ "$F" -gt 0 ] || [ "$T" -eq 0 ]; then
              echo "$EDITION puppeteer FAILED"
              FAILED=1
            else
              echo "$EDITION puppeteer OK"
            fi
          done

          # Informational only, same as every dev workflow — the startup noise
          # (missing license.lic, nginx 502 before DS is up) is not a test failure.
          echo "=== DS log errors ==="
          for VAR in DS_LOG_ERRORS_EE DS_LOG_ERRORS_DE DS_LOG_ERRORS_CE; do
            echo "$VAR: ${!VAR:-0}"
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Save results
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github/workflow-results
          python3 - << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          def b(v):   return os.environ.get(v, 'false') == 'true'
          def n(v):   return int(os.environ.get(v, '0') or '0')
          def s(v):   return os.environ.get(v, 'not set')
          def ok(E):  # the same conditions as Final check (DS log errors are information only)
              return (b(f'HEALTHCHECK_{E}') and b(f'VERSION_{E}_OK') and b(f'SERVICES_{E}_OK')
                      and n(f'PUPPETEER_{E}_FAILED') == 0 and n(f'PUPPETEER_{E}_TOTAL') > 0)

          data = {
              'run_date': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'ee': {
                  'healthy':          b('HEALTHCHECK_EE'),
                  'hc_port':          os.environ.get('HC_PORT_EE', ''),
                  'version_ok':       b('VERSION_EE_OK'),
                  'version_actual':   s('VERSION_EE_ACTUAL'),
                  'services_ok':      b('SERVICES_EE_OK'),
                  'services_text':    s('SERVICES_EE_TEXT'),
                  'puppeteer_failed':      n('PUPPETEER_EE_FAILED'),
                  'puppeteer_ok':          n('PUPPETEER_EE_OK'),
                  'puppeteer_total':       n('PUPPETEER_EE_TOTAL'),
