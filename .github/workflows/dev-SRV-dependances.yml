name: dev SRV dependances

on:
  schedule:
    - cron: '0 13 * * 3'  # Wednesday 16:00 Moscow time (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dependances:
    runs-on: ubuntu-24.04
    name: dev SRV dependances x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Puppeteer
        uses: ./.github/actions/setup-puppeteer
        with:
          git_ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region us-east-1

      - name: Create EC2 Instance
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ami-0b6c6ebed2801a5cb \
            --instance-type t2.medium \
            --key-name demin \
            --security-groups AllPortsOpened \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=demin_dev-srv-dependances}]' \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":50,"VolumeType":"gp3"}}]' \
            --query "Instances[0].InstanceId" --output text)

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
          echo "Waiting for instance to start..."
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID

      - name: Get EC2 Public IP
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --query "Reservations[].Instances[].PublicIpAddress" --output text)
          echo "EC2 Public IP: $IP"
          echo "EC2_IP=$IP" >> $GITHUB_ENV

      - name: Wait for SSH to be Ready
        run: sleep 120

      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa

      - name: Upgrade packages
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << 'EOF'
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get upgrade -y && break
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed, retrying in 30s..."
              sleep 30
            else
              echo "All attempts failed"
              exit 1
            fi
          done
          EOF

      - name: Reboot EC2 Instance
        run: aws ec2 reboot-instances --instance-ids ${{ env.INSTANCE_ID }}

      - name: Wait for instance to reboot after upgrade
        run: sleep 180

      - name: Install Docker on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << EOF
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \$(. /etc/os-release && echo "\$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo systemctl start docker
          EOF

      - name: DS-VPATH Docker reInstall
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << EOF
          sudo docker network rm ds-network 2>/dev/null || true
          sudo docker network create ds-network
          sudo docker pull onlyoffice/4testing-documentserver-ee:${{ vars.ONLYOFFICE_DEV_VERSION }}.${{ vars.ONLYOFFICE_DEV_BUILD }}
          sudo docker run -itd --network ds-network --name ds-ee-dev -e WOPI_ENABLED=true onlyoffice/4testing-documentserver-ee:${{ vars.ONLYOFFICE_DEV_VERSION }}.${{ vars.ONLYOFFICE_DEV_BUILD }}
          EOF

      - name: Wait for DS startup 240
        run: sleep 240

      - name: Add example host to DS ipfilter
        continue-on-error: true
        uses: ./.github/actions/set-ipfilter
        with:
          ssh_host: ${{ env.EC2_IP }}
          container: ds-ee-dev
          allow_hosts: ${{ env.EC2_IP }}

      - name: DS-VPATH Start nginx container
        continue-on-error: true
        run: |
          scp -o StrictHostKeyChecking=no dev-SRV-dependances/nginx-vpath.conf \
            ubuntu@${{ env.EC2_IP }}:~/nginx-vpath.conf
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << EOF
          sudo docker rm -f ds-vpath-nginx 2>/dev/null || true
          sudo docker run -d --network ds-network -p 80:80 --name ds-vpath-nginx \
            -v ~/nginx-vpath.conf:/etc/nginx/conf.d/default.conf:ro nginx:latest
          EOF

      - name: DS-VPATH Info
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << EOF
          sudo apt-get install jq -y
          echo "-------------healthcheck-------------"
          curl -s http://${{ env.EC2_IP }}/ds-vpath/healthcheck; echo
          echo "-------------DS services-------------"
          sudo docker exec ds-ee-dev supervisorctl status all || true
          echo "---------Installed packages----------"
          sudo docker exec ds-ee-dev bash -c "dpkg -l | grep onlyoffice"
          echo "--------packageType--------"
          sudo docker exec ds-ee-dev curl -s http://127.0.0.1/info/info.json | jq | grep -i -e buildVersion -e buildNumber -e packageType
          echo "-------------WOPI--------------"
          curl -s http://${{ env.EC2_IP }}/ds-vpath/hosting/discovery | tail -c 150; echo
          EOF

      - name: DS-VPATH Check healthcheck
        continue-on-error: true
        run: |
          HC=$(curl -s "http://${{ env.EC2_IP }}/ds-vpath/healthcheck" || echo "error")
          echo "Healthcheck: $HC"
          echo "HEALTHCHECK_DS_VPATH=$HC" >> $GITHUB_ENV

      - name: DS-VPATH Check version
        continue-on-error: true
        run: |
          VERSION=$(ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} \
            "sudo docker exec ds-ee-dev dpkg-query -W onlyoffice-documentserver-ee" | awk '{print $2}')
          EXPECTED="${{ vars.ONLYOFFICE_DEV_VERSION }}-${{ vars.ONLYOFFICE_DEV_BUILD }}"
          echo "Version: installed=$VERSION, expected=$EXPECTED"
          if [ "$VERSION" = "$EXPECTED" ]; then
            echo "VERSION_DS_VPATH_OK=true" >> $GITHUB_ENV
          else
            echo "VERSION_DS_VPATH_OK=false" >> $GITHUB_ENV
          fi
          echo "VERSION_DS_VPATH_ACTUAL=$VERSION" >> $GITHUB_ENV

      - name: DS-VPATH Start ds-example
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} \
            "sudo docker exec ds-ee-dev supervisorctl start ds:example"

      - name: DS-VPATH Clear puppeteer output
        run: rm -rf Dep.Tests/puppeteer/out

      - name: DS-VPATH Puppeteer API tests
        continue-on-error: true
        run: |
          cd Dep.Tests/puppeteer/engine
          sed -i -E "s#\"url\": \"https?://[^\"]*/example\"#\"url\": \"http://${{ env.EC2_IP }}/ds-vpath/example\"#" ../config_chrome_linux.json
          echo "-------------------------------------"
          jq -r '.testOptions.url' ../config_chrome_linux.json
          echo "-------------------------------------"
          python3 run.py ../tests/web/desktop/word/input/input_text.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers example
          python3 run.py ../tests/web/desktop/spreadsheets/hometab/font/font_bold.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers example
          python3 run.py ../tests/web/desktop/presentation/hometab/input/input_text_and_download.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers example
          python3 run.py ../tests/web/desktop/pdf/smoke/check_find_for_a_specific_pdf.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers example
          python3 run.py ../tests/web/desktop/pdf-form/rightmenu/insert_checkbox.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers example
          python3 run.py ../tests/web/desktop/openers/vsdx.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers example

      - name: DS-VPATH Puppeteer WOPI tests
        continue-on-error: true
        run: |
          cd Dep.Tests/puppeteer/engine
          echo "-------------------------------------"
          jq -r '.testOptions.url' ../config_chrome_linux.json
          echo "-------------------------------------"
          python3 run.py ../tests/web/desktop/word/input/input_text.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers wopi
          python3 run.py ../tests/web/desktop/spreadsheets/hometab/font/font_bold.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers wopi
          python3 run.py ../tests/web/desktop/presentation/hometab/input/input_text_and_download.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers wopi
          python3 run.py ../tests/web/desktop/pdf/smoke/check_find_for_a_specific_pdf.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers wopi
          python3 run.py ../tests/web/desktop/pdf-form/rightmenu/insert_checkbox.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers wopi
          # vsdx.js WOPI test disabled — feature not finished yet (fails on WOPI provider)
          # python3 run.py ../tests/web/desktop/openers/vsdx.js --disable_animation --config_params puppeteerOptions.headless=true puppeteerOptions.channel=chrome --providers wopi

      - name: DS-VPATH Parse puppeteer results
        if: always()
        run: python3 .github/scripts/parse-puppeteer-results.py --edition DS_VPATH

      - name: DS-VPATH Documentserver logs
        continue-on-error: true
        uses: ./.github/actions/ds-logs
        with:
          mode: ssh-docker
          ssh_host: ${{ env.EC2_IP }}
          container: ds-ee-dev

      - name: DS-VPATH Check DS logs for errors
        continue-on-error: true
        uses: ./.github/actions/check-ds-logs
        with:
          mode: ssh-docker-logs
          ssh_host: ${{ env.EC2_IP }}
          container: ds-ee-dev
          env_var: DS_LOG_ERRORS_DS_VPATH
          label: DS_VPATH

      - name: DS-VPATH Remove nginx container
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} \
            "sudo docker rm -f ds-vpath-nginx || true"

      - name: AMQP_ARTEMIS Docker reInstall
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << EOF
          sudo docker stop \$(sudo docker ps -q) 2>/dev/null || true
          sudo docker rm \$(sudo docker ps -aq) 2>/dev/null || true
          sudo docker network rm ds-network 2>/dev/null || true
          sudo docker network create ds-network
          sudo docker run -d --network ds-network \
            --name onlyoffice-mq \
            -e ARTEMIS_USER=artemis \
            -e ARTEMIS_PASSWORD=artemis \
            apache/activemq-artemis:2.40.0-alpine
          sudo docker run -itd --network ds-network -p 80:80 \
            --name ds-ee-dev \
            -e AMQP_TYPE=activemq \
            -e AMQP_URI=amqp://artemis:artemis@onlyoffice-mq \
            -e JWT_ENABLED=true \
            -e JWT_SECRET=MYSECRET \
            -e WOPI_ENABLED=true \
            onlyoffice/4testing-documentserver-ee:${{ vars.ONLYOFFICE_DEV_VERSION }}.${{ vars.ONLYOFFICE_DEV_BUILD }}
