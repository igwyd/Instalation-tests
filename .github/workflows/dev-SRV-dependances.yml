      - name: Save results
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github/workflow-results
          python3 - << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          def b(v): return os.environ.get(v, 'false') == 'true'
          def n(v): return int(os.environ.get(v, '0') or '0')
          def s(v): return os.environ.get(v, 'not set')

          # puppeteer passes only when nothing failed AND something actually ran
          def ppt_ok(failed, total): return failed == 0 and total > 0

          vp_ppt       = n('PUPPETEER_DS_VPATH_FAILED')
          vp_ok        = n('PUPPETEER_DS_VPATH_OK')
          vp_total     = n('PUPPETEER_DS_VPATH_TOTAL')
          art_ppt      = n('PUPPETEER_AMQP_ARTEMIS_FAILED')
          art_ok       = n('PUPPETEER_AMQP_ARTEMIS_OK')
          art_total    = n('PUPPETEER_AMQP_ARTEMIS_TOTAL')
          cls_ppt      = n('PUPPETEER_AMQP_CLASSIC_FAILED')
          cls_ok       = n('PUPPETEER_AMQP_CLASSIC_OK')
          cls_total    = n('PUPPETEER_AMQP_CLASSIC_TOTAL')
          rr_ppt       = n('PUPPETEER_REDIS_REDIS_FAILED')
          rr_ok        = n('PUPPETEER_REDIS_REDIS_OK')
          rr_total     = n('PUPPETEER_REDIS_REDIS_TOTAL')
          ri_ppt       = n('PUPPETEER_REDIS_IOREDIS_FAILED')
          ri_ok        = n('PUPPETEER_REDIS_IOREDIS_OK')
          ri_total     = n('PUPPETEER_REDIS_IOREDIS_TOTAL')
          cr_ppt       = n('PUPPETEER_REDIS_CLUSTER_REDIS_FAILED')
          cr_ok        = n('PUPPETEER_REDIS_CLUSTER_REDIS_OK')
          cr_total     = n('PUPPETEER_REDIS_CLUSTER_REDIS_TOTAL')
          ci_ppt       = n('PUPPETEER_REDIS_CLUSTER_IOREDIS_FAILED')
          ci_ok        = n('PUPPETEER_REDIS_CLUSTER_IOREDIS_OK')
          ci_total     = n('PUPPETEER_REDIS_CLUSTER_IOREDIS_TOTAL')
          vp_ds   = n('DS_LOG_ERRORS_DS_VPATH')
          art_ds  = n('DS_LOG_ERRORS_AMQP_ARTEMIS')
          cls_ds  = n('DS_LOG_ERRORS_AMQP_CLASSIC')
          rr_ds   = n('DS_LOG_ERRORS_REDIS_REDIS')
          ri_ds   = n('DS_LOG_ERRORS_REDIS_IOREDIS')
          cr_ds   = n('DS_LOG_ERRORS_REDIS_CLUSTER_REDIS')
          ci_ds   = n('DS_LOG_ERRORS_REDIS_CLUSTER_IOREDIS')

          data = {
              'run_date': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'vpath': {
                  'healthy':               b('HEALTHCHECK_DS_VPATH'),
                  'version_ok':            b('VERSION_DS_VPATH_OK'),
                  'version_actual':        s('VERSION_DS_VPATH_ACTUAL'),
                  'puppeteer_failed':      vp_ppt,
                  'puppeteer_ok':          vp_ok,
                  'puppeteer_total':       vp_total,
                  'ds_log_errors':         vp_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_DS_VPATH') and b('VERSION_DS_VPATH_OK') and ppt_ok(vp_ppt, vp_total) and vp_ds == 0) else 'failure',
              },
              'amqp_artemis': {
                  'healthy':               b('HEALTHCHECK_AMQP_ARTEMIS'),
                  'version_ok':            b('VERSION_AMQP_ARTEMIS_OK'),
                  'version_actual':        s('VERSION_AMQP_ARTEMIS_ACTUAL'),
                  'puppeteer_failed':      art_ppt,
                  'puppeteer_ok':          art_ok,
                  'puppeteer_total':       art_total,
                  'ds_log_errors':         art_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_AMQP_ARTEMIS') and b('VERSION_AMQP_ARTEMIS_OK') and ppt_ok(art_ppt, art_total) and art_ds == 0) else 'failure',
              },
              'amqp_classic': {
                  'healthy':               b('HEALTHCHECK_AMQP_CLASSIC'),
                  'version_ok':            b('VERSION_AMQP_CLASSIC_OK'),
                  'version_actual':        s('VERSION_AMQP_CLASSIC_ACTUAL'),
                  'puppeteer_failed':      cls_ppt,
                  'puppeteer_ok':          cls_ok,
                  'puppeteer_total':       cls_total,
                  'ds_log_errors':         cls_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_AMQP_CLASSIC') and b('VERSION_AMQP_CLASSIC_OK') and ppt_ok(cls_ppt, cls_total) and cls_ds == 0) else 'failure',
              },
              'redis_redis': {
                  'healthy':               b('HEALTHCHECK_REDIS_REDIS'),
                  'version_ok':            b('VERSION_REDIS_REDIS_OK'),
                  'version_actual':        s('VERSION_REDIS_REDIS_ACTUAL'),
                  'redis_sock_ok':         b('REDIS_SOCK_OK_REDIS_REDIS'),
                  'port_6379_closed':      b('PORT_6379_CLOSED_REDIS_REDIS'),
                  'puppeteer_failed':      rr_ppt,
                  'puppeteer_ok':          rr_ok,
                  'puppeteer_total':       rr_total,
                  'ds_log_errors':         rr_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_REDIS_REDIS') and b('VERSION_REDIS_REDIS_OK') and b('REDIS_SOCK_OK_REDIS_REDIS') and b('PORT_6379_CLOSED_REDIS_REDIS') and ppt_ok(rr_ppt, rr_total) and rr_ds == 0) else 'failure',
              },
              'redis_ioredis': {
                  'healthy':               b('HEALTHCHECK_REDIS_IOREDIS'),
                  'version_ok':            b('VERSION_REDIS_IOREDIS_OK'),
                  'version_actual':        s('VERSION_REDIS_IOREDIS_ACTUAL'),
                  'redis_sock_ok':         b('REDIS_SOCK_OK_REDIS_IOREDIS'),
                  'port_6379_closed':      b('PORT_6379_CLOSED_REDIS_IOREDIS'),
                  'puppeteer_failed':      ri_ppt,
                  'puppeteer_ok':          ri_ok,
                  'puppeteer_total':       ri_total,
                  'ds_log_errors':         ri_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_REDIS_IOREDIS') and b('VERSION_REDIS_IOREDIS_OK') and b('REDIS_SOCK_OK_REDIS_IOREDIS') and b('PORT_6379_CLOSED_REDIS_IOREDIS') and ppt_ok(ri_ppt, ri_total) and ri_ds == 0) else 'failure',
              },
              'redis_cluster_redis': {
                  'healthy':               b('HEALTHCHECK_REDIS_CLUSTER_REDIS'),
                  'version_ok':            b('VERSION_REDIS_CLUSTER_REDIS_OK'),
                  'version_actual':        s('VERSION_REDIS_CLUSTER_REDIS_ACTUAL'),
                  'cluster_ok':            b('CLUSTER_OK_REDIS_CLUSTER_REDIS'),
                  'puppeteer_failed':      cr_ppt,
                  'puppeteer_ok':          cr_ok,
                  'puppeteer_total':       cr_total,
                  'ds_log_errors':         cr_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_REDIS_CLUSTER_REDIS') and b('VERSION_REDIS_CLUSTER_REDIS_OK') and b('CLUSTER_OK_REDIS_CLUSTER_REDIS') and ppt_ok(cr_ppt, cr_total) and cr_ds == 0) else 'failure',
              },
              'redis_cluster_ioredis': {
                  'healthy':               b('HEALTHCHECK_REDIS_CLUSTER_IOREDIS'),
                  'version_ok':            b('VERSION_REDIS_CLUSTER_IOREDIS_OK'),
                  'version_actual':        s('VERSION_REDIS_CLUSTER_IOREDIS_ACTUAL'),
                  'cluster_ok':            b('CLUSTER_OK_REDIS_CLUSTER_IOREDIS'),
                  'puppeteer_failed':      ci_ppt,
                  'puppeteer_ok':          ci_ok,
                  'puppeteer_total':       ci_total,
                  'ds_log_errors':         ci_ds,
                  'conclusion': 'success' if (b('HEALTHCHECK_REDIS_CLUSTER_IOREDIS') and b('VERSION_REDIS_CLUSTER_IOREDIS_OK') and b('CLUSTER_OK_REDIS_CLUSTER_IOREDIS') and ppt_ok(ci_ppt, ci_total) and ci_ds == 0) else 'failure',
              },
              'conclusion': os.environ.get('FINAL_CONCLUSION', 'failure'),
          }
          path = '.github/workflow-results/dev-srv-dependances.json'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          print(f'Saved: {path}')
          PYEOF

          aws s3 cp .github/workflow-results/dev-srv-dependances.json \
            s3://${{ vars.DASHBOARD_BUCKET_NAME }}/results/dev-srv-dependances.json \
            --region ${{ vars.DASHBOARD_BUCKET_REGION }}

      - name: Delete EC2 Instance
        if: always()
        run: |
          aws ec2 terminate-instances --instance-ids ${{ env.INSTANCE_ID }}
          aws ec2 wait instance-terminated --instance-ids ${{ env.INSTANCE_ID }}
