name: dev DB check x64

on:
  # schedule:  # отключено: новые dev-версии ещё не выложены
  #   - cron: '0 14 * * 3'  # Wednesday 17:00 UTC+3
  workflow_dispatch:
    inputs:
      db:
        description: 'Which matrix entries to run: all or a comma-separated list (mysql, postgres, postgres14..17, mssql, oracle, oracle-thick, dameng, mariadb)'
        default: all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          DB_INPUT: ${{ inputs.db }}
        run: |
          cat > all.json <<'EOF'
          [
            {"db": "mysql", "db_image": "mysql:latest", "db_name": "mysqldb", "db_port": 3306, "db_type": "mysql", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "postgres", "db_image": "postgres:latest", "db_name": "postgresdb", "db_port": 5432, "db_type": "postgres", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "postgres14", "db_image": "postgres:14", "db_name": "postgresdb", "db_port": 5432, "db_type": "postgres", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "postgres15", "db_image": "postgres:15", "db_name": "postgresdb", "db_port": 5432, "db_type": "postgres", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "postgres16", "db_image": "postgres:16", "db_name": "postgresdb", "db_port": 5432, "db_type": "postgres", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "postgres17", "db_image": "postgres:17", "db_name": "postgresdb", "db_port": 5432, "db_type": "postgres", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "mssql", "db_image": "docker.io/igwyd890/mssql-onlyoffice:2025", "db_name": "mssqldb", "db_port": 1433, "db_type": "mssql", "db_database": "onlyoffice", "db_user": "sa", "db_pwd": "onlYoff1ce", "k6_stage_ramp": "1m:50", "k6_stage_main": "9m:50"},
            {"db": "oracle", "db_image": "container-registry.oracle.com/database/free:latest-lite", "db_name": "oracledb", "db_port": 1521, "db_type": "oracle", "db_database": "FREEPDB1", "db_user": "SYSTEM", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:100", "k6_stage_main": "9m:100"},
            {"db": "oracle-thick", "db_image": "container-registry.oracle.com/database/free:latest-lite", "db_name": "oracledb", "db_port": 1521, "db_type": "oracle", "db_database": "FREEPDB1", "db_user": "SYSTEM", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:100", "k6_stage_main": "9m:100", "oracle_thin": "false"},
            {"db": "dameng", "db_image": "igwyd890/dameng-onlyoffice:8.1.3", "db_name": "damengdb", "db_port": 5236, "db_type": "dameng", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "Onlyoffice_2026", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"},
            {"db": "mariadb", "db_image": "mariadb:latest", "db_name": "mariadbdb", "db_port": 3306, "db_type": "mysql", "db_database": "onlyoffice", "db_user": "onlyoffice", "db_pwd": "onlyoffice", "k6_stage_ramp": "1m:500", "k6_stage_main": "9m:500"}
          ]
          EOF
          # ponytail: exact match on matrix names, no globbing
          SEL=$(echo "${DB_INPUT:-all}" | tr -d ' ')
          if [ "$SEL" = "all" ]; then
            jq -c . all.json > m.json
          else
            jq -c --arg sel "$SEL" '[.[] | select(.db as $d | ($sel | split(",") | index($d)))]' all.json > m.json
          fi
          [ "$(jq length m.json)" -gt 0 ] || { echo "No matrix entry matches: $SEL"; exit 1; }
          echo "matrix=$(cat m.json)" >> "$GITHUB_OUTPUT"

  db-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create docker network and start containers
        run: |
          docker network create ds-network

          case "${{ matrix.db }}" in
            mysql)
              docker run -d --network ds-network --name ${{ matrix.db_name }} \
                -e MYSQL_ROOT_PASSWORD=onlyoffice \
                -e MYSQL_DATABASE=onlyoffice \
                -e MYSQL_USER=onlyoffice \
                -e MYSQL_PASSWORD=onlyoffice \
                ${{ matrix.db_image }}
              ;;
            postgres | postgres14 | postgres15 | postgres16 | postgres17)
              docker run -d --network ds-network --name ${{ matrix.db_name }} \
                -e POSTGRES_DB=onlyoffice \
                -e POSTGRES_USER=onlyoffice \
                -e POSTGRES_PASSWORD=onlyoffice \
                ${{ matrix.db_image }}
              ;;
            mssql)
              docker run -d --network ds-network --name ${{ matrix.db_name }} \
                -e ACCEPT_EULA=Y \
                -e SA_PASSWORD=onlYoff1ce \
                ${{ matrix.db_image }}
              ;;
            oracle | oracle-thick)
              docker run -d --network ds-network --name ${{ matrix.db_name }} \
                -e ORACLE_PWD=${{ matrix.db_pwd }} \
                ${{ matrix.db_image }}
              ;;
            dameng)
              docker run -d --network ds-network --name ${{ matrix.db_name }} \
                -e PAGE_SIZE=16 \
                -e LD_LIBRARY_PATH=/opt/dmdbms/bin \
                -e INSTANCE_NAME=dm8_01 \
                ${{ matrix.db_image }}
              ;;
            mariadb)
              docker run -d --network ds-network --name ${{ matrix.db_name }} \
                -e MARIADB_ROOT_PASSWORD=onlyoffice \
                -e MARIADB_DATABASE=onlyoffice \
                -e MARIADB_USER=onlyoffice \
                -e MARIADB_PASSWORD=onlyoffice \
                ${{ matrix.db_image }}
              ;;
          esac

          docker run -d --network ds-network -p 80:80 \
            -e DB_TYPE=${{ matrix.db_type }} \
            -e DB_HOST=${{ matrix.db_name }} \
            -e DB_PORT=${{ matrix.db_port }} \
            -e DB_NAME=${{ matrix.db_database }} \
            -e DB_USER=${{ matrix.db_user }} \
            -e DB_PWD=${{ matrix.db_pwd }} \
            -e WOPI_ENABLED=true \
            -e JWT_SECRET=MYSECRET \
            --name onlyoffice \
            onlyoffice/4testing-documentserver-ee:${{ vars.ONLYOFFICE_DEV_VERSION }}.${{ vars.ONLYOFFICE_DEV_BUILD }}

      - name: docker containers STATUS
        run: |
          docker ps -a

      - name: Wait for ${{ matrix.db }} DB and ONLYOFFICE to be ready
        run: sleep 240

      - name: Get runner IP
        id: runner_ip
        run: |
          IP=$(ip route get 1 | awk '{print $7}')
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV
          echo "Runner IP is $IP"

      - name: ADD document, dummy_end_points and license for tests
        run: |
          docker exec onlyoffice wget -O /var/www/onlyoffice/documentserver/sample.zip https://nct2.onlyoffice.com/s/y-3qCyC7GkMcYv8
          for i in 1 2 3 4 5; do docker exec onlyoffice bash -c "apt-get update && apt-get install -y unzip" && break; echo "apt retry $i"; sleep 20; done
          docker exec onlyoffice unzip /var/www/onlyoffice/documentserver/sample.zip -d /var/www/onlyoffice/documentserver/
          docker cp performance-test/local-production-linux.json onlyoffice:/etc/onlyoffice/documentserver/local-production-linux.json
          docker exec onlyoffice supervisorctl restart ds:docservice
          docker exec onlyoffice supervisorctl restart ds:converter

          cat <<'EOF' > license.lic
          ${{ secrets.LICENSE_KEY }}
          EOF
          docker cp license.lic onlyoffice:/var/www/onlyoffice/Data/license.lic

      - name: CHECK document, dummy_end_points and license
        run: |
          echo '--- local-production-linux.json  ---'
          docker exec onlyoffice cat /etc/onlyoffice/documentserver/local-production-linux.json
          echo '--- Sample.docx in documentserver ---'
          docker exec onlyoffice ls /var/www/onlyoffice/documentserver/
          echo '--- license ---'
          docker exec onlyoffice ls /var/www/onlyoffice/Data/

      - name: Set Oracle driver mode (thin=${{ matrix.oracle_thin || 'true' }})
        if: matrix.db_type == 'oracle'
        run: |
          # thick needs Oracle Instant Client, bundled in the image at /usr/share/instantclient
          docker cp onlyoffice:/etc/onlyoffice/documentserver/local.json local.json
          jq '.services.CoAuthoring.sql.oracleExtraOptions.thin = ${{ matrix.oracle_thin || 'true' }}' local.json > local.new.json
          docker cp local.new.json onlyoffice:/etc/onlyoffice/documentserver/local.json
          if [ "${{ matrix.oracle_thin }}" = "false" ]; then
            # LD_LIBRARY_PATH in docker run doesn't reach ds-converter (supervisor overrides it), so register the dir in ldconfig
            docker exec onlyoffice bash -c 'echo /usr/share/instantclient > /etc/ld.so.conf.d/instantclient.conf && ldconfig'
            # pkg unpacks the thick .node into <documentserver>/.cache, but that dir is read-only (dr-xr-xr-x) for ds:
            # ds-converter fails with "EACCES mkdir .../.cache/pkg" (NJS-045) and silently falls back to thin
            docker exec onlyoffice bash -c 'mkdir -p /var/www/onlyoffice/documentserver/.cache && chown -R ds:ds /var/www/onlyoffice/documentserver/.cache'
          fi
          docker exec onlyoffice supervisorctl restart ds:docservice ds:converter
          sleep 30
          echo "--- oracleExtraOptions in local.json ---"
          docker exec onlyoffice jq '.services.CoAuthoring.sql' /etc/onlyoffice/documentserver/local.json || docker exec onlyoffice grep -A3 oracleExtraOptions /etc/onlyoffice/documentserver/local.json
          echo "--- Instant Client ---"
          docker exec onlyoffice bash -c 'ldconfig -p | grep libclntsh || echo "libclntsh not in ldconfig cache"; echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"'
          docker exec onlyoffice supervisorctl status all || true

      - name: INFO about installed Package, must be ONLYOFFICE-Docs EE
        continue-on-error: true
        run: |
          for i in 1 2 3; do sudo apt-get install jq -y && break; sleep 20; done

          echo "-------------healthcheck-------------"
          HEALTHCHECK_RESULT=$(curl -s http://${RUNNER_IP}/healthcheck || echo "error")
          # real TCP port curl connected to (0 = no connection), shown next to healthcheck in the dashboard
          echo "HC_PORT_RESULT=$(curl -s -o /dev/null -w '%{remote_port}' "http://${RUNNER_IP}/healthcheck" || true)" >> $GITHUB_ENV
          echo "Healthcheck: $HEALTHCHECK_RESULT"
          echo "HEALTHCHECK_RESULT=$HEALTHCHECK_RESULT" >> $GITHUB_ENV
          echo "-------------DS services-------------"
          docker exec onlyoffice supervisorctl status all || true
          echo "---------Installed packages----------"
          docker exec onlyoffice bash -c "dpkg -l | grep onlyoffice"
          echo "----------${{ matrix.db }} version-----------"
          case "${{ matrix.db }}" in
            mysql)
              docker exec ${{ matrix.db_name }} mysql --version
              ;;
            postgres | postgres14 | postgres15 | postgres16 | postgres17)
              docker exec ${{ matrix.db_name }} psql --version
              ;;
            mssql)
              docker exec ${{ matrix.db_name }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "onlYoff1ce" -Q "SELECT @@VERSION" -C
              ;;
            oracle | oracle-thick)
              docker exec ${{ matrix.db_name }} sqlplus -version
              ;;
            dameng)
              docker exec ${{ matrix.db_name }} bash -c '/opt/dmdbms/bin/disql -S SYSDBA/SYSDBA_dm001@localhost:5236 -E "SELECT banner FROM v\$version;"'
              ;;
            mariadb)
              docker exec ${{ matrix.db_name }} mariadb --version
              ;;
          esac
          echo "--------packageType must be 1--------"
          docker exec onlyoffice curl -s http://127.0.0.1/info/info.json | jq | grep -i -e buildVersion -e buildNumber -e packageType
          echo "-------------WOPI local--------------"
          output=$(curl -s http://${RUNNER_IP}/hosting/discovery)
          if echo "$output" | grep -q 'value='; then
            echo "$output" | grep -o 'value="[^"]*"' | head -n 5 | cut -c1-100
          else
            echo "$output"
          fi

      - name: Setup Puppeteer
        uses: ./.github/actions/setup-puppeteer
        with:
          git_ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Add example host to DS ipfilter
        continue-on-error: true
        uses: ./.github/actions/set-ipfilter
        with:
          mode: docker-local
          container: onlyoffice
          allow_hosts: ${{ env.RUNNER_IP }}

      - name: Start ds-example
        run: docker exec onlyoffice supervisorctl start ds:example

      - name: Run Puppeteer Tests
        uses: ./.github/actions/run-puppeteer
        with:
          url: http://${{ env.RUNNER_IP }}/example

      - name: Check Oracle driver mode (thin=${{ matrix.oracle_thin || 'true' }})
        if: matrix.db_type == 'oracle'
        continue-on-error: true
        run: |
          WANT=${{ matrix.oracle_thin == 'false' && 'thk' || 'thn' }}
          DRV=$(docker exec -i ${{ matrix.db_name }} sqlplus -s ${{ matrix.db_user }}/${{ matrix.db_pwd }}@localhost:${{ matrix.db_port }}/${{ matrix.db_database }} <<'SQL'
          set heading off feedback off
          select client_driver || ' x' || count(*) from v$session_connect_info where client_driver like 'node-oracledb%' group by client_driver;
          SQL
          )
          echo "--- DS sessions in Oracle by client_driver ---"
          echo "${DRV:-<none>}"
          echo "expected: node-oracledb $WANT"
          # for the dashboard: expected mode + DS sessions by driver, one line
          echo "ORACLE_MODE=$([ $WANT = thk ] && echo thick || echo thin)" >> "$GITHUB_ENV"
          echo "ORACLE_DRIVERS=$(echo "$DRV" | grep 'node-oracledb' | sed 's/^ *//' | paste -sd';' - | cut -c1-200)" >> "$GITHUB_ENV"
          echo "--- DS logs: Oracle driver errors (DPI-/NJS-/ORA-) ---"
          docker exec onlyoffice bash -c "grep -rhE 'DPI-|NJS-|ORA-[0-9]+|thick|Instant Client' /var/log/onlyoffice/documentserver/docservice/*.log /var/log/onlyoffice/documentserver/converter/*.log | sort -u | cut -c1-300 | head -20" || true
          # client_driver looks like "node-oracledb : 6.10.0 thn"
          if echo "$DRV" | grep -q "node-oracledb.* $WANT " && ! echo "$DRV" | grep -q "node-oracledb.* $([ $WANT = thk ] && echo thn || echo thk) "; then
            echo "ORACLE_MODE_OK=true" >> "$GITHUB_ENV"
          else
            echo "ORACLE_MODE_OK=false" >> "$GITHUB_ENV"; exit 1
          fi

      - name: Documentserver logs PUPPETEER TEST
        continue-on-error: true
        uses: ./.github/actions/ds-logs
        with:
          mode: docker-local
          container: onlyoffice

      - name: Parse PUPPETEER TEST results
        if: always()
        run: python3 .github/scripts/parse-puppeteer-results.py

      - name: Install pre-requisites for LOAD test
        run: |
          git clone https://github.com/ONLYOFFICE/document-server-stress-testing.git -b ${{ vars.K6_BRANCH }}
          cd document-server-stress-testing/K6/

          sed -i 's|"serverNameOrIp": "localhost"|"serverNameOrIp": "onlyoffice"|' save-changes-document-random-close.json
          sed -i 's|"documentUrl": "https://example.com/url-to-example-document"|"documentUrl": "http://onlyoffice/wopi/files/docid/contents"|' save-changes-document-random-close.json
          sed -i 's|"callbackUrl": "https://example.com/url-to-callback"|"callbackUrl": "http://onlyoffice/dummyCallback"|' save-changes-document-random-close.json
          sed -i 's|"jwtSecret": ""|"jwtSecret": "MYSECRET"|' save-changes-document-random-close.json

      - name: INFO about save-changes-document-random-close.json
        run: |
          echo "------ Updated json ------"
          cd document-server-stress-testing/K6/
          cat save-changes-document-random-close.json

      - name: Run K6 LOAD test
        working-directory: document-server-stress-testing/K6
        run: |
          set -o pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            --network ds-network \
            -v "$(pwd)":/k6 \
            grafana/k6 run /k6/save-changes-document-random-close.js \
            --quiet \
            -s "${{ matrix.k6_stage_ramp }}" -s "${{ matrix.k6_stage_main }}" \
            | tee k6-output.txt

      - name: Parse K6 results
        continue-on-error: true
        run: |
          python3 - << 'PYEOF'
          import re, os
          try:
              with open('document-server-stress-testing/K6/k6-output.txt') as f:
                  text = f.read()
              def counter(name):
                  m = re.search(rf'{re.escape(name)}[.\s]+:\s+(\d+)', text)
                  return int(m.group(1)) if m else 0
              def trend_avg(name):
                  m = re.search(rf'{re.escape(name)}[.\s]+:.*?avg=([0-9.]+)ms', text)
                  return round(float(m.group(1)), 2) if m else 0.0
              def trend_p90(name):
                  m = re.search(rf'{re.escape(name)}[.\s]+:.*?p\(90\)=([0-9.]+)ms', text)
                  return round(float(m.group(1)), 2) if m else 0.0
              lines = [
                  f"K6_EXC_ALL={counter('custom_counter_exception_all')}",
                  f"K6_EXC_AUTH={counter('custom_counter_exception_auth')}",
                  f"K6_EXC_CONNECT={counter('custom_counter_exception_connect')}",
                  f"K6_EXC_CONVERT={counter('custom_counter_exception_convert')}",
                  f"K6_EXC_ISSAVELOCK={counter('custom_counter_exception_isSaveLock')}",
                  f"K6_EXC_OPEN={counter('custom_counter_exception_open')}",
                  f"K6_EXC_SAVECHANGES={counter('custom_counter_exception_saveChanges')}",
                  f"K6_MANUAL_CLOSE={counter('custom_counter_manual_close')}",
                  f"K6_AUTH_AVG={trend_avg('custom_trend_auth')}",
                  f"K6_AUTH_P90={trend_p90('custom_trend_auth')}",
                  f"K6_CONNECT_AVG={trend_avg('custom_trend_connect')}",
                  f"K6_CONNECT_P90={trend_p90('custom_trend_connect')}",
                  f"K6_CONVERT_AVG={trend_avg('custom_trend_convert')}",
                  f"K6_CONVERT_P90={trend_p90('custom_trend_convert')}",
                  f"K6_ISSAVELOCK_AVG={trend_avg('custom_trend_isSaveLock')}",
                  f"K6_ISSAVELOCK_P90={trend_p90('custom_trend_isSaveLock')}",
                  f"K6_OPEN_AVG={trend_avg('custom_trend_open')}",
                  f"K6_OPEN_P90={trend_p90('custom_trend_open')}",
                  f"K6_SAVECHANGES_AVG={trend_avg('custom_trend_saveChanges')}",
                  f"K6_SAVECHANGES_P90={trend_p90('custom_trend_saveChanges')}",
              ]
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('\n'.join(lines) + '\n')
              print('\n'.join(lines))
          except Exception as e:
              print(f"Warning: could not parse k6 output: {e}")
          PYEOF

      - name: Documentserver logs
        continue-on-error: true
        uses: ./.github/actions/ds-logs
        with:
          mode: docker-local
          container: onlyoffice

      - name: Check DS logs for errors
        continue-on-error: true
        uses: ./.github/actions/check-ds-logs
        with:
          mode: docker-local
          container: onlyoffice
          env_var: DS_LOG_ERRORS

      - name: Final check
        if: always()
        run: |
          FAILED=0
          EXPECTED="${{ vars.ONLYOFFICE_DEV_VERSION }}-${{ vars.ONLYOFFICE_DEV_BUILD }}"

          # --- Evaluate each check ---
          if [ "${HEALTHCHECK_RESULT}" = "true" ]; then
            HC_ICON="✅"; HC_LABEL="OK";     HC_DETAIL="${HEALTHCHECK_RESULT}"
          else
            HC_ICON="❌"; HC_LABEL="FAILED"; HC_DETAIL="${HEALTHCHECK_RESULT:-not set}"; FAILED=1
          fi

          VERSION_ACTUAL=$(docker exec onlyoffice bash -c "dpkg -l | grep onlyoffice" | awk '{print $3}' | head -n 1)
          echo "VERSION_ACTUAL=$VERSION_ACTUAL" >> "$GITHUB_ENV"
          if [ "$VERSION_ACTUAL" = "$EXPECTED" ]; then
            VER_ICON="✅"; VER_LABEL="OK"
            echo "VERSION_OK=true" >> "$GITHUB_ENV"
          else
            VER_ICON="❌"; VER_LABEL="FAILED"; FAILED=1
            echo "VERSION_OK=false" >> "$GITHUB_ENV"
          fi
          VER_DETAIL="exp: ${EXPECTED}, act: ${VERSION_ACTUAL:-not set}"

          PPTR_TOTAL="${PUPPETEER_FAILED:-0}"; PPT_O="${PUPPETEER_OK:-0}"; PPT_T="${PUPPETEER_TOTAL:-0}"
          PPT_DETAIL="${PPT_O}/${PPT_T} passed, ${PPTR_TOTAL} failed"
          if [ "$PPTR_TOTAL" -gt 0 ] || [ "$PPT_T" -eq 0 ]; then
            PPT_ICON="❌"; PPT_LABEL="FAILED"; FAILED=1
          else
            PPT_ICON="✅"; PPT_LABEL="OK"
          fi

          if [ "${{ matrix.db_type }}" = "oracle" ] && [ "${ORACLE_MODE_OK:-}" != "true" ]; then echo "Oracle driver mode not confirmed (ORACLE_MODE_OK=${ORACLE_MODE_OK:-unset})"; FAILED=1; fi

          DS_ERRORS="${DS_LOG_ERRORS:-0}"
          DS_DETAIL="${DS_ERRORS} errors"
          if [ "$DS_ERRORS" -gt 0 ]; then
            DS_ICON="❌"; DS_LABEL="FAILED"
          else
            DS_ICON="✅"; DS_LABEL="OK"
          fi

          # --- GITHUB_STEP_SUMMARY (markdown table) ---
          {
            echo "## Final Check — ${{ matrix.db }}"
            echo ""
            echo "| Check | Result | Details |"
            echo "|-------|--------|---------|"
            echo "| Healthcheck   | ${HC_ICON} ${HC_LABEL}  | ${HC_DETAIL} |"
            echo "| Version       | ${VER_ICON} ${VER_LABEL} | \`${EXPECTED}\` → \`${VERSION_ACTUAL:-not set}\` |"
            echo "| Puppeteer     | ${PPT_ICON} ${PPT_LABEL} | ${PPT_DETAIL} |"
            echo "| DS Log Errors | ${DS_DETAIL} | |"
            if [ "${{ matrix.db_type }}" = "oracle" ]; then
              echo "| Oracle driver | $([ "${ORACLE_MODE_OK:-}" = true ] && echo "✅ OK" || echo "❌ FAILED") | expected \`${ORACLE_MODE:-?}\`, sessions: \`${ORACLE_DRIVERS:-none}\` |"
            fi
            echo ""
            if [ "$FAILED" -eq 1 ]; then
              echo "> ❌ **Final check FAILED**"
            else
              echo "> ✅ **All checks passed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # --- Console log (ASCII table) ---
          SEP="+----------------------+--------+--------------------------------------------+"
          echo "$SEP"
          printf "| %-20s | %-6s | %-42s |\n" "Check" "Result" "Details"
          echo "$SEP"
          printf "| %-20s | %-6s | %-42s |\n" "Healthcheck"   "${HC_LABEL}"  "${HC_DETAIL}"
          printf "| %-20s | %-6s | %-42s |\n" "Version"       "${VER_LABEL}" "${VER_DETAIL}"
          printf "| %-20s | %-6s | %-42s |\n" "Puppeteer"     "${PPT_LABEL}" "${PPT_DETAIL}"
          printf "| %-20s | %-6s | %-42s |\n" "DS Log Errors" ""  "${DS_DETAIL}"
          if [ "${{ matrix.db_type }}" = "oracle" ]; then
            printf "| %-20s | %-6s | %-42s |\n" "Oracle driver" "$([ "${ORACLE_MODE_OK:-}" = true ] && echo OK || echo FAILED)" "${ORACLE_MODE:-?}: ${ORACLE_DRIVERS:-none}"
          fi
          echo "$SEP"

          if [ "$FAILED" -eq 1 ]; then
            echo "FINAL_CONCLUSION=failure" >> "$GITHUB_ENV"
            exit 1
          else
            echo "FINAL_CONCLUSION=success" >> "$GITHUB_ENV"
          fi

      - name: Save results
        if: always()
        continue-on-error: true
        env:
          DB_NAME: ${{ matrix.db }}
          EXPECTED_VERSION: ${{ vars.ONLYOFFICE_DEV_VERSION }}-${{ vars.ONLYOFFICE_DEV_BUILD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DASHBOARD_BUCKET_REGION }}
        run: |
          mkdir -p .github/workflow-results
          python3 - << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          data = {
              "run_date": datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              "healthy": os.environ.get('HEALTHCHECK_RESULT', '') == 'true',
              "hc_port": os.environ.get('HC_PORT_RESULT', ''),
              "version_expected": os.environ.get('EXPECTED_VERSION', ''),
              "version_actual": os.environ.get('VERSION_ACTUAL', 'not set'),
              "version_ok": os.environ.get('VERSION_OK', '') == 'true',
              "puppeteer_api_failed": int(os.environ.get('PUPPETEER_API_FAILED', '0') or '0'),
              "puppeteer_wopi_failed": int(os.environ.get('PUPPETEER_WOPI_FAILED', '0') or '0'),
              "puppeteer_total_failed": int(os.environ.get('PUPPETEER_FAILED', '0') or '0'),
              "puppeteer_ok": int(os.environ.get('PUPPETEER_OK', '0') or '0'),
              "puppeteer_total": int(os.environ.get('PUPPETEER_TOTAL', '0') or '0'),
              "ds_log_errors": int(os.environ.get('DS_LOG_ERRORS', '0') or '0'),
              "ds_log_errors_text": os.environ.get('DS_LOG_ERRORS_TEXT', ''),
              "oracle_mode_ok": os.environ.get('ORACLE_MODE_OK', ''),
              "oracle_mode": os.environ.get('ORACLE_MODE', ''),
              "oracle_drivers": os.environ.get('ORACLE_DRIVERS', ''),
              "conclusion": os.environ.get('FINAL_CONCLUSION', 'failure'),
              "k6": {
                  "exceptions": {
                      "all":          int(os.environ.get('K6_EXC_ALL', '0') or '0'),
                      "auth":         int(os.environ.get('K6_EXC_AUTH', '0') or '0'),
                      "connect":      int(os.environ.get('K6_EXC_CONNECT', '0') or '0'),
                      "convert":      int(os.environ.get('K6_EXC_CONVERT', '0') or '0'),
                      "isSaveLock":   int(os.environ.get('K6_EXC_ISSAVELOCK', '0') or '0'),
                      "open":         int(os.environ.get('K6_EXC_OPEN', '0') or '0'),
                      "saveChanges":  int(os.environ.get('K6_EXC_SAVECHANGES', '0') or '0'),
                      "manual_close": int(os.environ.get('K6_MANUAL_CLOSE', '0') or '0'),
                  },
                  "trends": {
                      "auth":        {"avg": float(os.environ.get('K6_AUTH_AVG', '0') or '0'),        "p90": float(os.environ.get('K6_AUTH_P90', '0') or '0')},
                      "connect":     {"avg": float(os.environ.get('K6_CONNECT_AVG', '0') or '0'),     "p90": float(os.environ.get('K6_CONNECT_P90', '0') or '0')},
                      "convert":     {"avg": float(os.environ.get('K6_CONVERT_AVG', '0') or '0'),     "p90": float(os.environ.get('K6_CONVERT_P90', '0') or '0')},
                      "isSaveLock":  {"avg": float(os.environ.get('K6_ISSAVELOCK_AVG', '0') or '0'), "p90": float(os.environ.get('K6_ISSAVELOCK_P90', '0') or '0')},
                      "open":        {"avg": float(os.environ.get('K6_OPEN_AVG', '0') or '0'),        "p90": float(os.environ.get('K6_OPEN_P90', '0') or '0')},
                      "saveChanges": {"avg": float(os.environ.get('K6_SAVECHANGES_AVG', '0') or '0'), "p90": float(os.environ.get('K6_SAVECHANGES_P90', '0') or '0')},
                  },
              },
          }
          db = os.environ.get('DB_NAME', 'unknown')
          path = f'.github/workflow-results/dev-db-{db}.json'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          print(f"Saved: {path}")
          PYEOF

          aws s3 cp .github/workflow-results/dev-db-${{ matrix.db }}.json \
            s3://${{ vars.DASHBOARD_BUCKET_NAME }}/results/dev-db-${{ matrix.db }}.json \
            --region ${{ vars.DASHBOARD_BUCKET_REGION }}
