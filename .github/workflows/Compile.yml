name: Compile from source x64

on:
  workflow_dispatch:

jobs:
  test-compilation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install DigitalOcean CLI
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Create Droplet
        run: |
            # Take ID/IP from the create output: the droplet is kept after the run, so grep by name
            # found two compile-test droplets on the next run (Invalid format in GITHUB_ENV)
            read ID IP < <(doctl compute droplet create compile-test \
              --region fra1 \
              --size s-4vcpu-8gb \
              --project-id ${{ secrets.DIGITALOCEAN_PROJECT_ID }} \
              --image ubuntu-24-04-x64 \
              --ssh-keys ${{ secrets.DIGITALOCEAN_SSH_KEY_ID }} \
              --format ID,PublicIPv4 --no-header \
              --wait)
            echo "DROPLET_ID=$ID" >> $GITHUB_ENV
            echo "DROPLET_IP=$IP" >> $GITHUB_ENV
  
      - name: Wait for SSH to be Ready
        run: sleep 120
  
      - name: Add SSH Key
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/id_rsa

      - name: Upgrade DEB packages
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
          sudo apt-get update
          sudo apt-get upgrade -y
          EOF

      - name: Set swap
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          sudo swapon --show
          free -h
          EOF

      - name: Server restart
        run: doctl compute droplet-action reboot ${{ env.DROPLET_ID }}

      - name: Wait for instance to reboot
        run: sleep 120

      - name: Create build user
        run: |
          # depot_tools as root: "Running depot tools as root is sad" - build as a regular user;
          # automate.py calls sudo itself (apt, cmake.sh), hence NOPASSWD
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          EOF

      - name: Start ONLYOFFICE Docs compilation
        run: |
          # The build takes ~4 hours: run it in the background (nohup) instead of holding an SSH session.
          # Full log goes to ~/build.log on the droplet, exit code to ~/build.rc
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
          sudo -iu builder git clone https://github.com/ONLYOFFICE/build_tools.git -b ${{ vars.ONLYOFFICE_BUILDTOOLS_BRANCH }}
          sudo -iu builder bash -c 'cd ~/build_tools/tools/linux && nohup bash -c "python3 ./automate.py; echo \$? > ~/build.rc" > ~/build.log 2>&1 < /dev/null &'
          sleep 10
          tail -n 20 /home/builder/build.log
          EOF

      - name: Wait for compilation
        # below the job limit (360): after a step timeout, Get/Upload build log still have time to run
        timeout-minutes: 330
        run: |
          # Print only the last build.log line every 5 minutes to the GitHub log (~50 lines in 4 hours),
          # the full log is uploaded as an artifact at the end
          while :; do
            sleep 300
            OUT=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@${{ env.DROPLET_IP }} 'cat /home/builder/build.rc 2>/dev/null || echo running; du -h /home/builder/build.log | cut -f1; tail -n 1 /home/builder/build.log | cut -c1-200' || echo "ssh failed")
            echo "[$(date -u +%H:%M)] $(echo "$OUT" | paste -sd ' | ')"
            RC=$(echo "$OUT" | head -1)
            [ "$RC" = running ] || [ "$RC" = "ssh failed" ] || break
          done
          echo "BUILD_RC=$RC" >> $GITHUB_ENV

      - name: Get build log
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} 'tail -n 200 /home/builder/build.log; gzip -kf /home/builder/build.log; ls -lah /home/builder/build_tools/out || true'
          scp -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }}:/home/builder/build.log.gz .

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.gz

      - name: Archive Compiled Files
        run: |
          scp -o StrictHostKeyChecking=no Compile/archive_out.py root@${{ env.DROPLET_IP }}:/home/builder/build_tools/archive_out.py
          ssh -o StrictHostKeyChecking=no root@${{ env.DROPLET_IP }} << 'EOF'
          cd /home/builder/build_tools
          python3 archive_out.py
          ls -lahtr
          EOF

      - name: Check build result
        run: |
          echo "automate.py exit code: ${{ env.BUILD_RC }}"
          [ "${{ env.BUILD_RC }}" = 0 ]
