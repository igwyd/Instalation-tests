# Use this example for the proxy document server running at 'ds-ee-dev'
# into the virtual directory 'ds-vpath'.

upstream docservice {
  server ds-ee-dev:80;
}

map $http_x_forwarded_proto $the_scheme {
     default $http_x_forwarded_proto;
     "" $scheme;
}

map $http_x_forwarded_host $the_host {
    default $http_x_forwarded_host;
    "" $host;
}

map $http_upgrade $proxy_connection {
  default upgrade;
  "" close;
}

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $proxy_connection;
proxy_set_header X-Forwarded-Host $the_host/ds-vpath;
proxy_set_header X-Forwarded-Proto $the_scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


server {
  listen 0.0.0.0:80;
  listen [::]:80 default_server;
  server_tokens off;

  location /ds-vpath/ {
    proxy_pass http://docservice/;
    proxy_http_version 1.1;
  }

  # The puppeteer engine probes these two at the origin root, ignoring the
  # virtual path of testOptions.url, and aborts the whole run on 404.
  # Editors are still loaded through /ds-vpath/ only.
  location /meta/ {
    proxy_pass http://docservice/meta/;
    proxy_http_version 1.1;
  }

  location /hosting/ {
    proxy_pass http://docservice/hosting/;
    proxy_http_version 1.1;
  }
}
